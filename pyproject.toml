[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pickledump"
version = "1.0.1"
description = "Dump or disassemble Python pickle files"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pickledump = "pickledump:pickle_cli"

[tool.setuptools]
py-modules = ["pickledump"]